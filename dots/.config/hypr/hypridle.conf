# Under the Lua config, `hyprctl dispatch global quickshell:lock` is parsed as Lua
# and errors out, so drive quickshell's lock via its IPC instead (fallback: hyprlock).
$lock_cmd = qs -c ${qsConfig} ipc call lock activate || pidof hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = $HOME/.config/hypr/custom/scripts/lock-and-suspend.sh idle

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # Re-grab keyboard focus after wake (Hyprland unfocuses the lock screen on
    # resume). Uses the IPC form; `hyprctl dispatch global quickshell:lockFocus`
    # errors out under the Lua config.
    after_sleep_cmd = qs -c ${qsConfig} ipc call lock focus
    inhibit_sleep = 3
}

listener {
    timeout = 600 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 72000 # 15mins
    on-timeout = $suspend_cmd
}
